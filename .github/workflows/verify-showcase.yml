name: Verify Observatory

on:
  push:
    branches:
      - "hackathon/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        # The committed Bun/npm lockfiles predate the declared Three.js dependency.
        # Install from package.json without rewriting the lockfiles in this CI run.
        run: bun install --no-save

      - name: Check TypeScript
        run: bun run lint

      - name: Run utility tests
        run: bun run test

      - name: Build production bundle
        run: bun run build
